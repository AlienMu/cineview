<!doctype html>
<html><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>first screen fixture</title>
<script>
  // The <head> snippet (v2/src/boot.ts HEAD_SNIPPET), inlined as a page would.
  (function(s){if(s&&s('selector(:has(*))')&&s('width:1lh')&&s('color:color-mix(in srgb,red,red)'))document.documentElement.classList.add('cv-js')})(window.CSS&&CSS.supports);
</script>
<link rel="stylesheet" href="/boot.css">
<style>
  html,body{margin:0} *{box-sizing:border-box}
  .box{display:block;height:80px;width:200px;background:#b3ded6}
  .unit{width:calc(var(--cv-unit) * 100);height:10px;background:#333}
</style></head>
<body>
<script type="module">
  // ?case=boot|mixed|preload|drag-boot|drag-preload, ?delay=ms before the module loads, ?timeout=ms
  const q = new URLSearchParams(location.search);
  const c = q.get('case') ?? 'boot';
  const input = c.startsWith('drag') ? ' input="drag"' : '';
  const timeout = q.has('timeout') ? ` first-scene-timeout="${q.get('timeout')}"` : '';
  const scene0 =
    c.endsWith('preload')
      ? `<cv-scene id="s0" preload><img id="img" src="/slow.png?${Date.now()}" width="10" height="10"><cv-animate id="a" fx="rise"><div class="box"></div></cv-animate></cv-scene>`
      : c === 'mixed'
        ? `<cv-scene id="s0"><cv-animate id="a" fx="rise"><div class="box"></div></cv-animate><cv-animate id="b" fx="rise" delay="100"><div class="box"></div></cv-animate></cv-scene>`
        : `<cv-scene id="s0"><cv-animate id="a" fx="rise"><div class="box"></div></cv-animate><cv-animate id="b" fx="fade"><div class="box"></div></cv-animate><div id="unit" class="unit"></div></cv-scene>`;
  document.body.insertAdjacentHTML('afterbegin', `
  <cv-stage id="s"${input} design-width="${q.get('dw') ?? 375}"${timeout}>
    ${scene0}
    <cv-scene id="s1" style="height:${input ? '' : '1200px'}"><div class="box"></div></cv-scene>
  </cv-stage>`);
  window.timeouts = [];
  document.addEventListener('cv-timeout', (e) => {
    window.timeouts.push(e.detail);
    if (q.has('prevent')) e.preventDefault();
  });
  window.cvErrors = [];
  document.addEventListener('cv-error', (e) => window.cvErrors.push(e.detail.message));
  window.ready = new Promise((r) => document.addEventListener('cv-ready', r, { once: true }));
  /** Visible opacity of an element: host × its layers. */
  window.seen = (id) => {
    const a = document.getElementById(id);
    let o = Number(getComputedStyle(a).opacity);
    for (const l of a.shadowRoot?.querySelectorAll('.l') ?? []) o *= Number(getComputedStyle(l).opacity);
    return o;
  };
  // Sample visible opacity every frame from the first one, to catch a flash at the handover.
  window.samples = [];
  const sample = () => {
    window.samples.push({ t: performance.now(), live: document.getElementById('a').hasAttribute('data-cv-live'), o: window.seen('a') });
    if (window.samples.length < 120) requestAnimationFrame(sample);
  };
  requestAnimationFrame(sample);
  await new Promise((r) => setTimeout(r, Number(q.get('delay') ?? 0)));
  await import('@v2');
</script>
</body></html>
