<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>V2 desktop composition checks</title>
    <style>
      @font-face {
        font-family: 'CV Variable';
        src: url('./media/fonts/RobotoMono-wght.ttf') format('truetype');
        font-weight: 100 700;
      }
      [data-font] {
        font-family: 'CV Variable', monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        font:
          16px/1.45 system-ui,
          sans-serif;
        background: #e9e3d6;
        color: #172b29;
      }
      cv-stage {
        display: block;
      }
      cv-scene {
        display: block;
        min-height: 100vh;
        background: #e9e3d6;
      }
      .bookend {
        height: 100vh;
        display: grid;
        place-content: center;
        background: #173c38;
        color: #f3eddc;
      }
      .sheet {
        padding: 32px;
        min-height: 100vh;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 20px;
      }
      .tile {
        min-width: 0;
        position: relative;
        padding: 16px;
        min-height: 250px;
        border: 1px solid #aab8ad;
        background: #f8f3e9;
        overflow: clip;
      }
      .tile h2 {
        margin: 0 0 12px;
        font-size: 17px;
      }
      .sample {
        width: 100%;
        height: 140px;
        background: #bccebb;
        padding: 16px;
      }
      .sample img,
      .photo {
        display: block;
        width: 100%;
        height: 140px;
        object-fit: cover;
      }
      .words {
        font-size: 26px;
        line-height: 1.3;
      }
      .bar {
        height: 18px;
        background: #bb552e;
        transform-origin: left;
        transform: scaleX(var(--p, 0));
      }
      .timeline {
        height: 8px;
        background: #638f7a;
      }
      .scroller {
        display: flex;
        gap: 8px;
        width: 100%;
        height: 140px;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        overscroll-behavior: contain;
        touch-action: pan-x;
      }
      .scroller > div {
        min-width: 100%;
        height: 110px;
        display: grid;
        place-content: center;
        background: #b4c9b4;
        scroll-snap-align: start;
      }
      .stop > div {
        scroll-snap-stop: always;
      }
      .deck > div {
        height: 120px;
        padding: 12px;
        background: #a9c3af;
        border: 1px solid #587668;
      }
      .image-frame {
        height: 140px;
        position: relative;
        overflow: clip;
      }
      .image-frame img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .caption {
        margin-top: 8px;
        min-height: 24px;
      }
      .mask-text {
        font-size: 70px;
        font-weight: 900;
        color: transparent;
        background: linear-gradient(120deg, #173c38, #be592e);
        background-clip: text;
      }
      .vertical {
        writing-mode: vertical-rl;
        height: 140px;
        font-size: 24px;
      }
      .marquee {
        overflow: clip;
        white-space: nowrap;
      }
      .marquee > div {
        width: max-content;
        display: flex;
        gap: 0;
      }
      .marquee span {
        display: block;
        padding-right: 24px;
      }
      [data-ref='41'] {
        background: var(--paper, #f8f3e9);
        color: var(--ink, #172b29);
      }
      cv-stage[data-cv-theme='middle'] {
        --paper: #f3e0bd;
        --ink: #183c36;
      }
      cv-stage[data-cv-theme='last'] {
        --paper: #c8d8cb;
        --ink: #203327;
      }
      cv-scene[data-cv-stuck] [data-ref='18'] .sample {
        outline: 4px solid #bb552e;
      }
      cv-scene[data-cv-current] [data-ref='19'] .sample {
        outline: 4px solid #638f7a;
      }
      @media (prefers-reduced-motion: reduce) {
        .page-loop {
          animation: none !important;
        }
      }
    </style>
    <script type="module" src="./combinations.js"></script>
  </head>
  <body>
    <main id="root"></main>
  </body>
</html>
