<!doctype html>
<html lang="en">
<head>
<title>Cineview 2.0 example: a canvas on the timeline</title>
<meta charset="utf-8">
<link rel="icon" href="/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(s){if(s&&s("selector(:has(*))")&&s("width:1lh")&&s("color:color-mix(in srgb,red,red)"))document.documentElement.classList.add("cv-js")})(window.CSS&&CSS.supports);</script>
<link rel="stylesheet" href="/v2/cineview.css">
<link rel="stylesheet" href="../example.css">
<script type="module" src="/v2/cineview.js"></script>
<style>
  .art { display: block; width: min(100%, 560px); aspect-ratio: 5 / 2; }
  .art canvas { display: block; width: 100%; height: 100%; border-radius: 12px; background: var(--surface); }
  .readout { font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink-soft); }
</style>
</head>
<body>
<cv-stage design-width="1200">
  <cv-scene id="before"><div class="screen"><span class="tag" data-zh="timeline.subscribe">timeline.subscribe</span><h2 data-zh="往下滚动，画布跟着这一场的时间绘制">Scroll down: the canvas draws on the scene's time</h2></div></cv-scene>
  <cv-scene id="zone" zone>
    <div class="screen">
      <cv-animate id="anchor" class="art" from="opacity:0.35" to="opacity:1" duration="2000" ease="linear"><canvas id="art" aria-hidden="true"></canvas></cv-animate>
      <p class="readout" id="readout">progress 0.00</p>
      <p data-zh="页面脚本订阅这个元素的时间线，按 0 到 1 的进度自己绘制。往回滚动，画面倒回。">The page subscribes to this element's timeline and draws from its progress, 0 to 1. Scroll back and it rewinds.</p>
    </div>
  </cv-scene>
  <cv-scene id="after"><div class="screen"><h2 data-zh="锁定区结束">End of the zone</h2></div></cv-scene>
</cv-stage>
<span class="hint" data-zh="在框内滚动">Scroll inside the frame</span>
<script src="../example.js"></script>
<script type="module">
  const anchor = document.getElementById('anchor');
  const canvas = document.getElementById('art');
  const readout = document.getElementById('readout');
  const ctx = canvas.getContext('2d');
  let last = -1;
  function size() {
    const r = canvas.getBoundingClientRect();
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    last = -1;
    draw(anchor.timeline.progress);
  }
  function draw(p) {
    if (Math.abs(p - last) < 0.001) return;
    last = p;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#2563eb';
    ctx.beginPath();
    const steps = Math.max(2, Math.round(240 * p));
    for (let i = 0; i <= steps; i++) {
      const t = (i / 240) * Math.PI * 4;
      const x = 24 + ((w - 48) * i) / 240;
      const y = h / 2 + Math.sin(t) * (h / 2 - 28) * (1 - i / 360);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    readout.textContent = 'progress ' + p.toFixed(2);
  }
  await customElements.whenDefined('cv-animate');
  anchor.timeline.subscribe((frame) => draw(frame.progress));
  new ResizeObserver(size).observe(canvas);
  size();
</script>
</body>
</html>
