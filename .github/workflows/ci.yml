name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: cineview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:framework:static
      - run: pnpm format:check:site
      - run: pnpm type-check
      - run: pnpm type-check:site
      - run: pnpm test:site-contracts
      # Source-level docs style gate (frontmatter eyebrows, fenced-code languages,
      # banned vocabulary, abbreviation expansion). Needs no browser, so it belongs
      # here rather than in the acceptance job.
      - run: pnpm docs:style:static
      - run: pnpm --dir site build
      - run: pnpm --dir examples/performance-test build

  browser-acceptance:
    name: Framework browser acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - run: pnpm test:browser
        env:
          CINEVIEW_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - run: pnpm verify:browser-failure-injection
        env:
          CINEVIEW_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

  react-19:
    name: React 19 peer compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm add --save-dev --ignore-workspace-root-check react@19.1.0 react-dom@19.1.0 @types/react@19.1.8 @types/react-dom@19.1.6
      - run: pnpm verify:framework:static
      - run: pnpm format:check:site
      - run: pnpm type-check
      - run: pnpm type-check:site
      - run: pnpm test:site-contracts
