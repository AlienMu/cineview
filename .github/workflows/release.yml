# Browser acceptance must pass before the npm publication job.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: cineview-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser-acceptance:
    name: Browser acceptance (release gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            site/pnpm-lock.yaml
            examples/minimal/pnpm-lock.yaml
      # These projects have separate lockfiles and are not a pnpm workspace.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir site install --frozen-lockfile
      - run: pnpm --dir examples/minimal install --frozen-lockfile
      - run: pnpm docs:links
      - run: pnpm audit:all
      - id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - run: pnpm test:browser
        env:
          CINEVIEW_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - run: pnpm verify:browser-failure-injection
        env:
          CINEVIEW_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - run: pnpm profile:browser
        env:
          CINEVIEW_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

  publish:
    name: Publish to npm
    needs: browser-acceptance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            site/pnpm-lock.yaml
            examples/minimal/pnpm-lock.yaml
      # These projects have separate lockfiles and are not a pnpm workspace.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir site install --frozen-lockfile
      - run: pnpm --dir examples/minimal install --frozen-lockfile

      # npm OIDC authentication requires npm >= 11.5.1. Keep the CLI version
      # explicit instead of relying on the version bundled with Node.
      - run: npm install --global npm@11.15.0

      # tag 与 package.json 必须一致，否则发出去的版本号与 tag 不符。
      - name: Assert tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG 与 package.json $PKG 不一致" >&2
            exit 1
          fi
          echo "版本一致: $PKG"

      # CHANGELOG 必须已记录该版本 —— 破坏性改名曾整批漏记。
      - name: Assert CHANGELOG has this version
        run: |
          PKG="$(node -p "require('./package.json').version")"
          grep -q "^## $PKG" CHANGELOG.md || {
            echo "CHANGELOG.md 缺少 ## $PKG 段" >&2; exit 1; }
          echo "CHANGELOG 已记录 $PKG"

      # `--provenance` 让 npm 记录该产物由哪次 workflow 构建。
      - name: Publish the selected release channel
        run: |
          RELEASE_CHANNEL=$(node -p "require('./package.json').version.includes('-') ? 'beta' : 'latest'")
          npm publish --provenance --access public --tag "$RELEASE_CHANNEL" --registry https://registry.npmjs.org
