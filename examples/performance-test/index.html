<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <title>CineView Performance Test - 20+ Scenes</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        overflow: hidden;
      }

      #root {
        width: 100vw;
        height: 100vh;
      }

      /* Performance Monitor Overlay */
      .performance-monitor {
        position: fixed;
        top: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.8);
        color: #00ff00;
        padding: 15px;
        border-radius: 8px;
        font-family: 'Courier New', monospace;
        font-size: 12px;
        z-index: 9999;
        min-width: 200px;
        backdrop-filter: blur(10px);
      }

      .performance-monitor h3 {
        margin-bottom: 10px;
        color: #fff;
        font-size: 14px;
        border-bottom: 1px solid #333;
        padding-bottom: 5px;
      }

      .performance-monitor .metric {
        display: flex;
        justify-content: space-between;
        margin: 5px 0;
      }

      .performance-monitor .metric-label {
        color: #aaa;
      }

      .performance-monitor .metric-value {
        color: #00ff00;
        font-weight: bold;
      }

      .performance-monitor .metric-value.warning {
        color: #ffaa00;
      }

      .performance-monitor .metric-value.error {
        color: #ff0000;
      }

      /* Scene Navigation */
      .scene-nav {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.8);
        color: #fff;
        padding: 10px 20px;
        border-radius: 20px;
        font-size: 14px;
        z-index: 9999;
        backdrop-filter: blur(10px);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
