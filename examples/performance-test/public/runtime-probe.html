<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineView Runtime Probe</title>
    <style>
      body {
        margin: 0;
        font-family: monospace;
        background: #111827;
        color: #e5e7eb;
      }

      pre {
        margin: 0;
        padding: 16px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <pre id="output">booting…</pre>
    <iframe
      id="target"
      src="/#/scroll"
      style="position: fixed; inset: 0; width: 1440px; height: 1100px; border: 0; opacity: 0; pointer-events: none;"
    ></iframe>
    <script>
      const output = document.getElementById('output');
      const frame = document.getElementById('target');

      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      function sampleState(doc) {
        const container = doc.querySelector('[data-cineview-container="true"]');
        const sceneWrappers = Array.from(doc.querySelectorAll('[data-scene-index]')).slice(0, 6);
        const animates = Array.from(doc.querySelectorAll('.cineview-animate')).slice(0, 24);
        const effectiveOpacity = (node) => {
          let current = node;
          let opacity = 1;

          while (current && current instanceof HTMLElement) {
            const value = Number.parseFloat(getComputedStyle(current).opacity || '1');
            if (Number.isFinite(value)) {
              opacity *= value;
            }
            current = current.parentElement;
          }

          return opacity;
        };

        return {
          container: container
            ? {
                scrollTop: container.scrollTop,
                scrollHeight: container.scrollHeight,
                clientHeight: container.clientHeight,
                overflowY: getComputedStyle(container).overflowY,
              }
            : null,
          zones: Array.from(doc.querySelectorAll('[data-cineview-scroll-zone]')).map((el) => ({
            id: el.getAttribute('data-cineview-scroll-zone'),
            top: el.getBoundingClientRect().top,
            bottom: el.getBoundingClientRect().bottom,
            opacity: getComputedStyle(el).opacity,
            transform: getComputedStyle(el).transform,
            visibility: getComputedStyle(el).visibility,
          })),
          scenes: sceneWrappers.map((el) => ({
            index: el.getAttribute('data-scene-index'),
            top: el.getBoundingClientRect().top,
            bottom: el.getBoundingClientRect().bottom,
            height: el.getBoundingClientRect().height,
            minHeight: getComputedStyle(el).minHeight,
          })),
          animates: animates.map((el) => ({
            id: el.getAttribute('data-cineview-animate-id'),
            opacity: getComputedStyle(el).opacity,
            effectiveOpacity: effectiveOpacity(el),
            transform: getComputedStyle(el).transform,
            top: el.getBoundingClientRect().top,
            bottom: el.getBoundingClientRect().bottom,
          })),
        };
      }

      async function run() {
        await new Promise((resolve, reject) => {
          frame.addEventListener('load', resolve, { once: true });
          frame.addEventListener('error', reject, { once: true });
        });

        const doc = frame.contentDocument;
        const win = frame.contentWindow;

        for (let i = 0; i < 40; i += 1) {
          if (doc.querySelector('[data-cineview-container="true"]')) {
            break;
          }
          await wait(100);
        }

        const container = doc.querySelector('[data-cineview-container="true"]');
        if (!container) {
          output.textContent = JSON.stringify({ error: 'scroll container not found' }, null, 2);
          return;
        }

        await wait(1000);
        const initial = sampleState(doc);
        container.scrollTop = Math.max(container.clientHeight, 1);
        container.dispatchEvent(new Event('scroll', { bubbles: true }));
        await wait(1000);
        const afterOneViewport = sampleState(doc);
        container.scrollTop = Math.max(container.clientHeight * 2.2, 1);
        container.dispatchEvent(new Event('scroll', { bubbles: true }));
        await wait(1000);
        const afterTwoViewport = sampleState(doc);
        container.scrollTop = 2700;
        container.dispatchEvent(new Event('scroll', { bubbles: true }));
        await wait(1000);
        const afterDirectPastSpecsAnchor = sampleState(doc);
        container.scrollTop = 2360;
        container.dispatchEvent(new Event('scroll', { bubbles: true }));
        await wait(250);
        container.dispatchEvent(
          new win.WheelEvent('wheel', {
            deltaY: 180,
            deltaMode: 0,
            bubbles: true,
            cancelable: true,
          })
        );
        await wait(250);
        container.dispatchEvent(
          new win.WheelEvent('wheel', {
            deltaY: 180,
            deltaMode: 0,
            bubbles: true,
            cancelable: true,
          })
        );
        await wait(1000);
        const afterWheelIntoSpecs = sampleState(doc);
        container.dispatchEvent(
          new win.WheelEvent('wheel', {
            deltaY: -700,
            deltaMode: 0,
            bubbles: true,
            cancelable: true,
          })
        );
        await wait(1000);
        const afterReversePastSpecs = sampleState(doc);
        container.dispatchEvent(
          new win.WheelEvent('wheel', {
            deltaY: 400,
            deltaMode: 0,
            bubbles: true,
            cancelable: true,
          })
        );
        await wait(1000);
        const afterForwardReentry = sampleState(doc);

        output.textContent = JSON.stringify(
          {
            href: win.location.href,
            initial,
            afterOneViewport,
            afterTwoViewport,
            afterDirectPastSpecsAnchor,
            afterWheelIntoSpecs,
            afterReversePastSpecs,
            afterForwardReentry,
          },
          null,
          2
        );
      }

      run().catch((error) => {
        output.textContent = JSON.stringify(
          {
            error: String(error),
            stack: error && error.stack ? String(error.stack) : null,
          },
          null,
          2
        );
      });
    </script>
  </body>
</html>
